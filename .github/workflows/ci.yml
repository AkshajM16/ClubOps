name: ClubOps checks
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clubops
          POSTGRES_USER: clubops
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubops -d clubops"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DJANGO_DEBUG: 'true'
      POSTGRES_DB: clubops
      POSTGRES_USER: clubops
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest backend/tests -q
      - run: npm ci
        working-directory: frontend
      - name: Verify generated schema and operations
        run: |
          python backend/manage.py shell -c 'from core.schema import schema; from pathlib import Path; Path("backend/schema.graphql").write_text(schema.as_str())'
          npm run codegen --prefix frontend
          git diff --exit-code -- backend/schema.graphql frontend/src/graphql/generated.ts
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - name: Start actual backend for browser tests
        run: |
          python backend/manage.py migrate
          python backend/manage.py seed_demo
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/clubops-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/session/; then exit 0; fi
            sleep 1
          done
          cat /tmp/clubops-backend.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
